<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img" aria-label="Tick processing pipeline: feed to static and dynamic layers to risk gate to router">
  <title>Gold Engine — tick pipeline</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="55%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>

    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#36BCF7" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#36BCF7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#36BCF7" stop-opacity="0.15"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- The path a tick travels. Referenced by the animated markers below so
         the dots and the drawn wire can never drift out of sync. -->
    <path id="track" d="M 86 150 H 250 H 430 H 610 H 786"/>
  </defs>

  <rect width="860" height="300" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="859" height="299" rx="14" fill="none" stroke="#36BCF7" stroke-opacity="0.25"/>

  <text x="30" y="42" fill="#e8f1f5" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="700">
    tick pipeline
  </text>
  <text x="30" y="64" fill="#7fb6cc" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">
    static layer on candle close · dynamic layer O(1) per tick
  </text>

  <!-- ── the wire ───────────────────────────────────────────────────────── -->
  <use href="#track" stroke="url(#wire)" stroke-width="2.5" fill="none"/>

  <!-- ── travelling ticks ───────────────────────────────────────────────────
       Four dots on the same path, staggered by begin offsets, so the pipeline
       reads as continuously fed rather than as a single pulse. -->
  <g filter="url(#glow)">
    <circle r="4.5" fill="#36BCF7">
      <animateMotion dur="3.4s" repeatCount="indefinite" begin="0s"><mpath href="#track"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="3.4s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle r="4.5" fill="#36BCF7">
      <animateMotion dur="3.4s" repeatCount="indefinite" begin="0.85s"><mpath href="#track"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="3.4s" repeatCount="indefinite" begin="0.85s"/>
    </circle>
    <circle r="4.5" fill="#5ee1a0">
      <animateMotion dur="3.4s" repeatCount="indefinite" begin="1.7s"><mpath href="#track"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="3.4s" repeatCount="indefinite" begin="1.7s"/>
    </circle>
    <circle r="4.5" fill="#36BCF7">
      <animateMotion dur="3.4s" repeatCount="indefinite" begin="2.55s"><mpath href="#track"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="3.4s" repeatCount="indefinite" begin="2.55s"/>
    </circle>
  </g>

  <!-- ── stages ─────────────────────────────────────────────────────────── -->
  <g font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace">

    <!-- feed -->
    <g>
      <rect x="26" y="122" width="120" height="56" rx="9" fill="#0b1b22" stroke="#36BCF7" stroke-opacity="0.55"/>
      <text x="86" y="147" fill="#e8f1f5" font-size="12.5" font-weight="600" text-anchor="middle">TickFeed</text>
      <text x="86" y="165" fill="#7fb6cc" font-size="10" text-anchor="middle">ws · replay · mt5</text>
      <animate attributeName="opacity" values="0.75;1;0.75" dur="3.4s" repeatCount="indefinite"/>
    </g>

    <!-- static layer -->
    <g>
      <rect x="190" y="122" width="132" height="56" rx="9" fill="#0b1b22" stroke="#5ee1a0" stroke-opacity="0.5"/>
      <text x="256" y="147" fill="#e8f1f5" font-size="12.5" font-weight="600" text-anchor="middle">static</text>
      <text x="256" y="165" fill="#7fb6cc" font-size="10" text-anchor="middle">OB · FVG · bias</text>
    </g>
    <text x="256" y="106" fill="#5ee1a0" font-size="9.5" text-anchor="middle" opacity="0.85">on candle close</text>

    <!-- dynamic layer -->
    <g>
      <rect x="368" y="122" width="132" height="56" rx="9" fill="#0b1b22" stroke="#36BCF7" stroke-opacity="0.55"/>
      <text x="434" y="147" fill="#e8f1f5" font-size="12.5" font-weight="600" text-anchor="middle">dynamic</text>
      <text x="434" y="165" fill="#7fb6cc" font-size="10" text-anchor="middle">sweep · FSM</text>
      <animate attributeName="opacity" values="1;0.72;1" dur="1.7s" repeatCount="indefinite"/>
    </g>
    <text x="434" y="106" fill="#36BCF7" font-size="9.5" text-anchor="middle" opacity="0.9">every tick · O(1)</text>

    <!-- risk gate -->
    <g>
      <rect x="548" y="122" width="126" height="56" rx="9" fill="#0b1b22" stroke="#f2c14e" stroke-opacity="0.55"/>
      <text x="611" y="147" fill="#e8f1f5" font-size="12.5" font-weight="600" text-anchor="middle">risk gate</text>
      <text x="611" y="165" fill="#7fb6cc" font-size="10" text-anchor="middle">spread · news veto</text>
    </g>

    <!-- router -->
    <g>
      <rect x="722" y="122" width="112" height="56" rx="9" fill="#0b1b22" stroke="#5ee1a0" stroke-opacity="0.55"/>
      <text x="778" y="147" fill="#e8f1f5" font-size="12.5" font-weight="600" text-anchor="middle">router</text>
      <text x="778" y="165" fill="#7fb6cc" font-size="10" text-anchor="middle">paper · live</text>
    </g>
  </g>

  <!-- ── numba kernels, feeding the static layer ────────────────────────── -->
  <g font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#7fb6cc">
    <line x1="256" y1="178" x2="256" y2="212" stroke="#5ee1a0" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="3 3"/>
    <rect x="168" y="212" width="176" height="42" rx="7" fill="#0b1b22" stroke="#5ee1a0" stroke-opacity="0.25"/>
    <text x="256" y="229" fill="#5ee1a0" font-size="10" text-anchor="middle" font-weight="600">numba kernels</text>
    <text x="256" y="245" text-anchor="middle">ema · atr · adx · swings</text>
  </g>

  <!-- ── rejected ticks falling out of the risk gate ────────────────────── -->
  <g>
    <line x1="611" y1="178" x2="611" y2="206" stroke="#f2c14e" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="611" y="224" fill="#f2c14e" font-size="9.5" font-family="'JetBrains Mono',ui-monospace,monospace" text-anchor="middle" opacity="0.8">vetoed</text>
    <circle cx="611" cy="186" r="3" fill="#f2c14e" opacity="0">
      <animate attributeName="cy" values="180;206" dur="3.4s" repeatCount="indefinite" begin="1.9s"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="3.4s" repeatCount="indefinite" begin="1.9s"/>
    </circle>
  </g>

  <!-- ── latency ticker ─────────────────────────────────────────────────── -->
  <g font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#5ee1a0">
    <circle cx="742" cy="47" r="3.5" fill="#5ee1a0">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.7s" repeatCount="indefinite"/>
    </circle>
    <text x="756" y="51" fill="#5ee1a0">non-blocking</text>
  </g>
</svg>
