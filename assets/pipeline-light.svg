<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Gold Engine tick pipeline"><title>Gold Engine tick pipeline</title><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#F3F6FA"/></linearGradient><clipPath id="clip"><rect width="900" height="300" rx="18"/></clipPath><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="900" height="300" rx="18" fill="url(#bg)"/><g clip-path="url(#clip)"><g stroke="#0B0F14" stroke-opacity="0.05" stroke-width="1"><line x1="50" y1="0" x2="50" y2="300"/><line x1="100" y1="0" x2="100" y2="300"/><line x1="150" y1="0" x2="150" y2="300"/><line x1="200" y1="0" x2="200" y2="300"/><line x1="250" y1="0" x2="250" y2="300"/><line x1="300" y1="0" x2="300" y2="300"/><line x1="350" y1="0" x2="350" y2="300"/><line x1="400" y1="0" x2="400" y2="300"/><line x1="450" y1="0" x2="450" y2="300"/><line x1="500" y1="0" x2="500" y2="300"/><line x1="550" y1="0" x2="550" y2="300"/><line x1="600" y1="0" x2="600" y2="300"/><line x1="650" y1="0" x2="650" y2="300"/><line x1="700" y1="0" x2="700" y2="300"/><line x1="750" y1="0" x2="750" y2="300"/><line x1="800" y1="0" x2="800" y2="300"/><line x1="850" y1="0" x2="850" y2="300"/><line x1="0" y1="50" x2="900" y2="50"/><line x1="0" y1="100" x2="900" y2="100"/><line x1="0" y1="150" x2="900" y2="150"/><line x1="0" y1="200" x2="900" y2="200"/><line x1="0" y1="250" x2="900" y2="250"/></g><text x="40" y="46" fill="#9A6300" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" text-anchor="start" letter-spacing="2.8">TICK PIPELINE</text><rect x="40" y="74" width="175" height="60" rx="8" fill="#0B0F14" fill-opacity="0.022" stroke="#0B0F14" stroke-opacity="0.10"/><rect x="40" y="74" width="3" height="60" fill="#9A6300" opacity="0.75"/><text x="128" y="104" fill="#0B0F14" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="middle">DataIngestionStream</text><text x="128" y="122" fill="#8496A8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="400" text-anchor="middle">TickFeed (ABC)</text><rect x="255" y="74" width="175" height="60" rx="8" fill="#0B0F14" fill-opacity="0.022" stroke="#0B0F14" stroke-opacity="0.10"/><rect x="255" y="74" width="3" height="60" fill="#9A6300" opacity="0.75"/><text x="343" y="104" fill="#0B0F14" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="middle">DualLayerEngine</text><text x="343" y="122" fill="#8496A8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="400" text-anchor="middle">SMCStateEngine</text><rect x="470" y="74" width="175" height="60" rx="8" fill="#0B0F14" fill-opacity="0.022" stroke="#0B0F14" stroke-opacity="0.10"/><rect x="470" y="74" width="3" height="60" fill="#9A6300" opacity="0.75"/><text x="558" y="104" fill="#0B0F14" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="middle">RiskExecutionManager</text><text x="558" y="122" fill="#8496A8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="400" text-anchor="middle">sizing  ·  veto</text><rect x="685" y="74" width="175" height="60" rx="8" fill="#0B0F14" fill-opacity="0.022" stroke="#0B0F14" stroke-opacity="0.10"/><rect x="685" y="74" width="3" height="60" fill="#9A6300" opacity="0.75"/><text x="773" y="104" fill="#0B0F14" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="middle">OrderRouter</text><text x="773" y="122" fill="#8496A8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="400" text-anchor="middle">paper by default</text><line x1="197" y1="104" x2="243" y2="104" stroke="#4A5B6E" stroke-width="1.2" opacity="0.8"/><path d="M243 104 L237 100.5 L237 107.5 Z" fill="#4A5B6E" opacity="0.8"/><text x="220" y="94" fill="#8496A8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" font-weight="400" text-anchor="middle">ticks</text><circle cy="104" r="2.6" fill="#9A6300"><animate attributeName="cx" from="197" to="241" dur="1.4s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="1.4s" begin="0.0s" repeatCount="indefinite"/></circle><line x1="412" y1="104" x2="458" y2="104" stroke="#4A5B6E" stroke-width="1.2" opacity="0.8"/><path d="M458 104 L452 100.5 L452 107.5 Z" fill="#4A5B6E" opacity="0.8"/><text x="435" y="94" fill="#8496A8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" font-weight="400" text-anchor="middle">context</text><circle cy="104" r="2.6" fill="#9A6300"><animate attributeName="cx" from="412" to="456" dur="1.4s" begin="0.45s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="1.4s" begin="0.45s" repeatCount="indefinite"/></circle><line x1="627" y1="104" x2="673" y2="104" stroke="#4A5B6E" stroke-width="1.2" opacity="0.8"/><path d="M673 104 L667 100.5 L667 107.5 Z" fill="#4A5B6E" opacity="0.8"/><text x="650" y="94" fill="#8496A8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" font-weight="400" text-anchor="middle">orders</text><circle cy="104" r="2.6" fill="#9A6300"><animate attributeName="cx" from="627" to="671" dur="1.4s" begin="0.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="1.4s" begin="0.9s" repeatCount="indefinite"/></circle><path d="M342 134 L342 160 L200 160 M342 160 L500 160" fill="none" stroke="#0B0F14" stroke-opacity="0.10" stroke-width="1.2"/><rect x="108" y="176" width="292" height="50" rx="8" fill="#0B0F14" fill-opacity="0.022" stroke="#0B0F14" stroke-opacity="0.10"/><text x="124" y="198" fill="#0B0F14" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start">static layer</text><text x="124" y="215" fill="#8496A8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="400" text-anchor="start">on candle close: pools, order blocks, bias</text><rect x="424" y="176" width="292" height="50" rx="8" fill="#0B0F14" fill-opacity="0.022" stroke="#0B0F14" stroke-opacity="0.10"/><text x="440" y="198" fill="#0B0F14" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start">dynamic layer</text><text x="440" y="215" fill="#8496A8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="400" text-anchor="start">every tick, O(1): sweep, mitigation FSM</text><rect x="40" y="252" width="820" height="1" fill="#0B0F14" fill-opacity="0.10"/><text x="40" y="274" fill="#4A5B6E" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Heavy structural work only on candle close; constant work per tick. Risk sits before the router, and the router is paper unless told otherwise.</text></g></svg>
