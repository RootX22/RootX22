<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 292" width="1000" height="292" role="img" aria-label="Example output from logsift: the three rare patterns surface above the routine traffic"><title>Example output from logsift: the three rare patterns surface above the routine traffic</title><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0B0F14"/><stop offset="100%" stop-color="#111922"/></linearGradient><clipPath id="clip"><rect width="1000" height="292" rx="18"/></clipPath><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1000" height="292" rx="18" fill="url(#bg)"/><g clip-path="url(#clip)"><g stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"><line x1="50" y1="0" x2="50" y2="292"/><line x1="100" y1="0" x2="100" y2="292"/><line x1="150" y1="0" x2="150" y2="292"/><line x1="200" y1="0" x2="200" y2="292"/><line x1="250" y1="0" x2="250" y2="292"/><line x1="300" y1="0" x2="300" y2="292"/><line x1="350" y1="0" x2="350" y2="292"/><line x1="400" y1="0" x2="400" y2="292"/><line x1="450" y1="0" x2="450" y2="292"/><line x1="500" y1="0" x2="500" y2="292"/><line x1="550" y1="0" x2="550" y2="292"/><line x1="600" y1="0" x2="600" y2="292"/><line x1="650" y1="0" x2="650" y2="292"/><line x1="700" y1="0" x2="700" y2="292"/><line x1="750" y1="0" x2="750" y2="292"/><line x1="800" y1="0" x2="800" y2="292"/><line x1="850" y1="0" x2="850" y2="292"/><line x1="900" y1="0" x2="900" y2="292"/><line x1="950" y1="0" x2="950" y2="292"/><line x1="0" y1="50" x2="1000" y2="50"/><line x1="0" y1="100" x2="1000" y2="100"/><line x1="0" y1="150" x2="1000" y2="150"/><line x1="0" y1="200" x2="1000" y2="200"/><line x1="0" y1="250" x2="1000" y2="250"/></g><text x="64" y="50" fill="#F0B429" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" text-anchor="start" letter-spacing="2.8">READOUT  ·  logsift</text><text x="936" y="50" fill="#55697D" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="end" letter-spacing="1.4">rarest first</text><rect x="64" y="62" width="872" height="1" fill="#FFFFFF" fill-opacity="0.08"/><text x="64" y="92" fill="#EAF1F8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="start">$ logsift &lt; app.log</text><text x="64" y="116" fill="#55697D" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="start">10000 lines -&gt; 24 patterns</text><text x="64" y="140" fill="#55697D" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="start">top 10 rarest patterns</text><rect x="52" y="177" width="2" height="15" fill="#F0B429"/><text x="64" y="188" fill="#EAF1F8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="start">  1x  CRITICAL kernel panic: unable to mount root fs on unknown-block(0,0)</text><rect x="52" y="201" width="2" height="15" fill="#F0B429"/><text x="64" y="212" fill="#EAF1F8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="start">  1x  {"level":"fatal","msg":"database connection pool exhausted","waiters":812}</text><rect x="52" y="225" width="2" height="15" fill="#F0B429"/><text x="64" y="236" fill="#EAF1F8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="start">  1x  segfault at 0000dead ip 00007f8a in libssl.so.1.1 error 6</text><text x="64" y="260" fill="#55697D" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="start" opacity="0.85">226x  2024-05-23T03:54:00Z GET /api/products 400 631ms from=10.0.237.39</text><text x="64" y="284" fill="#55697D" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="start" opacity="0.85">...</text><rect x="64" y="297" width="8" height="14" fill="#F0B429"><animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/></rect><rect x="64" y="246" width="872" height="1" fill="#FFFFFF" fill-opacity="0.08"/><text x="64" y="270" fill="#93A6B8" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">Ten thousand lines collapse into two dozen patterns, and the three that happened once are at the top.</text></g></svg>
